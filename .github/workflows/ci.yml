name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (safety core must stay at 100% coverage)
        run: npm test
      - name: AI evaluation (fails on any missed target)
        run: npm run eval
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (includes audio-safety suites)
        run: npm run e2e
      - name: Strict traceability (every MVP requirement has code and tests)
        run: npm run trace:strict
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
